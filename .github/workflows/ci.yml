name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: padma
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d padma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_URL: http://localhost:3000
      AUTH_MODE: oauth
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/padma?schema=public
      BETTER_AUTH_SECRET: ci-only-auth-secret-that-is-never-used-in-production
      INTEGRATION_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # The service container is empty on every run, so applying the schema
      # directly is unambiguous here. Local startup deliberately refuses to.
      - name: Create the database schema
        run: npm run db:push

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Check types, lint, and tests
        run: npm run check

      - name: Build production application
        run: npm run build
